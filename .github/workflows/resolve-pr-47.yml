name: Resolve upstream synchronization PR 47
on:
  push:
    branches: [upstream-main-2026-11-20]
    paths:
      - .github/workflows/resolve-pr-47.yml
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'jstnjx/remote-ui'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          submodules: false
      - name: Merge fork features into upstream line-by-line
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin sync-upstream-2026-11-20
          echo "Merge base: $(git merge-base HEAD origin/sync-upstream-2026-11-20)"
          git merge --no-commit --no-ff -X theirs origin/sync-upstream-2026-11-20
          git diff --cached --check
          if git ls-files -u | grep -q .; then
            echo "Unresolved index conflicts remain"
            git ls-files -u
            exit 1
          fi
          if git grep -n -E '^(<<<<<<< |=======|>>>>>>> )' -- src remote-ui.pro; then
            echo "Conflict markers found"
            exit 1
          fi
          for test in test/ui/*_sanity.py; do
            echo "Running $test"
            python3 "$test"
          done
          git rm -f .github/workflows/resolve-pr-47.yml
          git add -A
          git diff --cached --check
          git commit -m "Merge upstream 0.85.3 and fork-only UI features"
          git push origin HEAD:upstream-main-2026-11-20
